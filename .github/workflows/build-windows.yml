name: Build Windows 7 Desktop Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Build Standalone Windows 7 Executables (.exe)
        run: npx electron-builder --win --x64

      - name: Upload Windows 7 Standalone Desktop Application (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Noctis-Windows7-Desktop-Executable
          path: release-dist/*.exe
          retention-days: 30
